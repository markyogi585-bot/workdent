<script>
// WorkDent Interactive Component Handler
document.addEventListener('DOMContentLoaded', function() {
  console.log("WorkDent interactive enhancement loaded.");

  // 1. Mobile & Dropdown triggers
  document.querySelectorAll('[data-slot="dropdown-menu-trigger"], button').forEach(btn => {
    // Check if it looks like a dropdown or menu button
    const text = btn.innerText.trim();
    if (text.includes("Solutions") || text.includes("Menu") || btn.getAttribute("aria-haspopup") === "menu" || btn.querySelector('svg.lucide-chevron-down')) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        let menu = this.parentElement.querySelector('.dropdown-popover');
        if (!menu) {
          menu = document.createElement('div');
          menu.className = 'dropdown-popover absolute top-full mt-2 w-56 rounded-xl border border-border/80 bg-background/95 backdrop-blur-md shadow-2xl p-2 z-50 flex flex-col gap-1 transition-all';
          menu.innerHTML = `
            <a href="/as/dentist" class="px-3 py-2 rounded-lg text-sm text-foreground hover:bg-primary/10 hover:text-primary transition-colors flex items-center gap-2">🦷 For Dentists</a>
            <a href="/as/designer" class="px-3 py-2 rounded-lg text-sm text-foreground hover:bg-primary/10 hover:text-primary transition-colors flex items-center gap-2">📐 For CAD Designers</a>
            <a href="/as/lab" class="px-3 py-2 rounded-lg text-sm text-foreground hover:bg-primary/10 hover:text-primary transition-colors flex items-center gap-2">🔬 For Dental Labs</a>
            <hr class="border-border/60 my-1"/>
            <a href="/how-it-works" class="px-3 py-2 rounded-lg text-sm text-foreground hover:bg-primary/10 hover:text-primary transition-colors">⚡ How It Works</a>
          `;
          this.parentElement.style.position = 'relative';
          this.parentElement.appendChild(menu);
        } else {
          menu.classList.toggle('hidden');
        }
      });
    }
  });

  // Close menus on outside click
  document.addEventListener('click', () => {
    document.querySelectorAll('.dropdown-popover').forEach(m => m.classList.add('hidden'));
  });

  // 2. Mobile Hamburger Toggle
  const mobileToggle = document.querySelector('button[aria-label="Open menu"], button.md\\:hidden');
  if (mobileToggle) {
    mobileToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      let mobileNav = document.getElementById('workdent-mobile-nav');
      if (!mobileNav) {
        mobileNav = document.createElement('div');
        mobileNav.id = 'workdent-mobile-nav';
        mobileNav.className = 'fixed inset-x-3 top-20 bg-background/95 backdrop-blur-xl border border-border/80 rounded-2xl shadow-2xl p-6 z-50 flex flex-col gap-4 text-center md:hidden';
        mobileNav.innerHTML = `
          <a href="/how-it-works" class="text-base font-semibold text-foreground py-2 border-b border-border/40">How it works</a>
          <a href="/as/dentist" class="text-base font-semibold text-foreground py-2 border-b border-border/40">For Dentists</a>
          <a href="/as/designer" class="text-base font-semibold text-foreground py-2 border-b border-border/40">For Designers</a>
          <a href="/as/lab" class="text-base font-semibold text-foreground py-2 border-b border-border/40">For Labs</a>
          <a href="/find-designers" class="text-base font-semibold text-foreground py-2 border-b border-border/40">Browse Designers</a>
          <a href="/auth/login" class="text-base font-semibold text-primary py-2 border-b border-border/40">Log in</a>
          <a href="/auth/register" class="bg-primary text-primary-foreground font-semibold py-3 rounded-xl shadow-md">Sign Up Free</a>
        `;
        document.body.appendChild(mobileNav);
      } else {
        mobileNav.classList.toggle('hidden');
      }
    });
  }

  // 3. Theme Toggle (Dark / Light mode)
  document.querySelectorAll('button').forEach(btn => {
    if (btn.querySelector('.lucide-sun, .lucide-moon') || btn.getAttribute('aria-label') === 'Toggle theme') {
      btn.addEventListener('click', function() {
        const isDark = document.documentElement.classList.contains('dark');
        if (isDark) {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        } else {
          document.documentElement.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        }
      });
    }
  });

  // 4. Newsletter Subscribe and Quick Feedback
  document.querySelectorAll('footer form, footer button').forEach(el => {
    if (el.tagName === 'BUTTON' && el.innerText.trim().toLowerCase() === 'subscribe') {
      el.addEventListener('click', function(e) {
        e.preventDefault();
        const input = this.parentElement.querySelector('input');
        if (input && input.value) {
          const original = this.innerText;
          this.innerText = 'Subscribed! ✓';
          this.classList.add('bg-emerald-600');
          setTimeout(() => {
            this.innerText = original;
            this.classList.remove('bg-emerald-600');
            input.value = '';
          }, 3000);
        } else if (input) {
          input.focus();
          input.classList.add('border-red-500');
          setTimeout(() => input.classList.remove('border-red-500'), 2000);
        }
      });
    }
  });

  // 5. Ensure video auto-plays smoothly
  const videos = document.querySelectorAll('video');
  videos.forEach(v => {
    v.muted = true;
    v.play().catch(e => console.log("Video auto-play handled"));
  });
});
</script>
