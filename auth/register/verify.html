<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify Your Email &bull; WorkDent — Dental CAD Marketplace</title>
  <link rel="icon" href="/favicon.ico">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="/css/workdent-ui.css">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      margin: 0;
      color: #0f172a;
      background-color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .auth-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1.25rem;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.03);
    }
    .otp-digit {
      width: 3.25rem;
      height: 3.75rem;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: #0f172a;
      background-color: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 0.75rem;
      transition: all 0.15s ease-in-out;
    }
    .otp-digit:focus {
      outline: none;
      border-color: #2563eb;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }
    @media (max-width: 420px) {
      .otp-digit {
        width: 2.6rem;
        height: 3.25rem;
        font-size: 1.25rem;
      }
    }
    .hidden { display: none !important; }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <!-- Header -->
  <header class="py-5 px-6 max-w-7xl mx-auto w-full flex items-center justify-between">
    <a href="/" class="flex items-center text-2xl font-black text-slate-900 no-underline tracking-tight">
      <span class="font-extrabold tracking-tight">Work<span class="text-blue-600">Dent</span></span>
    </a>
    <div class="text-xs text-slate-600 font-medium">
      <a href="/auth/login" class="font-bold text-slate-600 hover:text-blue-600">Back to Sign In</a>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="max-w-md w-full">
      
      <div class="auth-card p-6 sm:p-10 text-center">
        
        <div class="size-14 rounded-2xl bg-blue-50 border border-blue-100 text-blue-600 flex items-center justify-center text-2xl mx-auto mb-5 shadow-xs">
          ✉️
        </div>

        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Verify Your Email</h1>
        <p class="text-slate-600 text-sm mt-2 leading-relaxed">
          Please enter the 6-digit code sent to<br>
          <span class="font-bold text-slate-900" id="display-email">your email</span>
        </p>

        <!-- Notice Banner -->
        <div id="auth-notice" class="hidden my-4 p-3 rounded-xl text-xs font-medium text-left"></div>

        <form id="verify-form" class="mt-6">
          
          <!-- 6-Box OTP Input -->
          <div class="flex items-center justify-center gap-2 sm:gap-2.5 mb-6" id="otp-container">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-digit" autocomplete="off" autofocus>
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-digit" autocomplete="off">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-digit" autocomplete="off">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-digit" autocomplete="off">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-digit" autocomplete="off">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-digit" autocomplete="off">
          </div>

          <button type="submit" id="verify-submit-btn" class="wd-btn-primary w-full justify-center py-3 text-sm">
            <span id="verify-btn-text">Verify & Continue</span>
            <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"></path>
            </svg>
          </button>

        </form>

        <!-- Resend Countdown Controls -->
        <div class="mt-6 pt-5 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
          <div>
            <span>Didn't get the code? </span>
            <button type="button" id="resend-btn" class="font-bold text-blue-600 hover:underline disabled:text-slate-400 disabled:no-underline disabled:cursor-not-allowed" disabled>
              Resend Code <span id="timer-count">(45s)</span>
            </button>
          </div>
          <a href="/auth/register" class="text-slate-500 hover:text-slate-800">Change Email</a>
        </div>

      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="/lib/workdent-supabase.js"></script>
  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const email = urlParams.get('email') || 'your account email';
      document.getElementById('display-email').textContent = email;

      const digits = Array.from(document.querySelectorAll('.otp-digit'));
      const form = document.getElementById('verify-form');
      const notice = document.getElementById('auth-notice');
      const submitBtn = document.getElementById('verify-submit-btn');
      const btnText = document.getElementById('verify-btn-text');
      const resendBtn = document.getElementById('resend-btn');
      const timerSpan = document.getElementById('timer-count');

      // Setup 6-digit Auto-advance & Backspace Navigation
      digits.forEach((input, idx) => {
        input.addEventListener('input', (e) => {
          const val = e.target.value.replace(/[^0-9]/g, '');
          e.target.value = val;
          if (val && idx < digits.length - 1) {
            digits[idx + 1].focus();
          }
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !input.value && idx > 0) {
            digits[idx - 1].focus();
          }
        });

        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const pasteData = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '').slice(0, 6);
          pasteData.split('').forEach((char, i) => {
            if (digits[i]) digits[i].value = char;
          });
          if (pasteData.length === 6) {
            digits[5].focus();
            form.requestSubmit();
          } else if (digits[pasteData.length]) {
            digits[pasteData.length].focus();
          }
        });
      });

      function showMsg(msg, type) {
        notice.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-200');
        if (type === 'error') {
          notice.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200');
        } else {
          notice.classList.add('bg-emerald-50', 'text-emerald-700', 'border', 'border-emerald-200');
        }
        notice.textContent = msg;
      }

      // Resend Countdown Timer
      let countdown = 45;
      const interval = setInterval(() => {
        countdown--;
        if (countdown <= 0) {
          clearInterval(interval);
          resendBtn.disabled = false;
          timerSpan.textContent = '';
        } else {
          timerSpan.textContent = `(${countdown}s)`;
        }
      }, 1000);

      resendBtn.addEventListener('click', async () => {
        resendBtn.disabled = true;
        countdown = 60;
        showMsg('New verification code sent to your email.', 'success');
        if (window.WorkDentAuth && email.includes('@')) {
          await window.WorkDentAuth.sendOtp({ email });
        }
      });

      // Verification Form Submit
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const code = digits.map(d => d.value).join('');

        if (code.length !== 6) {
          showMsg('Please enter all 6 digits of your verification code.', 'error');
          return;
        }

        submitBtn.disabled = true;
        btnText.textContent = 'Verifying...';

        const res = await window.WorkDentAuth.verifyOtp({ email, token: code });

        if (res.success) {
          showMsg('Email verified successfully! Setting up your workspace...', 'success');
          const dest = window.WorkDentAuth.getDashboardUrl(res.role);
          setTimeout(() => {
            window.location.href = dest;
          }, 600);
        } else {
          showMsg(res.error || 'Invalid or expired verification code.', 'error');
          btnText.textContent = 'Verify & Continue';
          submitBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
